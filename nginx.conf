# HTTP → investiup.com
server {
    listen 80;
    server_name investiup.com www.investiup.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP → vmi2777875.contaboserver.net (n8n)
server {
    listen 80;
    server_name vmi2777875.contaboserver.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP → meet.investiup.com
server {
    listen 80;
    server_name meet.investiup.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS → investiup.com
server {
    listen 443 ssl;
    server_name investiup.com www.investiup.com;

    ssl_certificate /etc/letsencrypt/live/investiup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/investiup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /app {
        rewrite ^/app(/.*)$ $1 break;
        rewrite ^/app$ / break;
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://landing:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS → vmi2777875.contaboserver.net (n8n)
server {
    listen 443 ssl;
    server_name vmi2777875.contaboserver.net;

    ssl_certificate /etc/letsencrypt/live/vmi2777875.contaboserver.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmi2777875.contaboserver.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://172.17.0.1:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

